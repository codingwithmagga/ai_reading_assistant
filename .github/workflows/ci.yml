name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true
          cache-dependency-glob: "backend/uv.lock"
      - run: uv lock --check
        working-directory: backend
      - run: uv sync --locked --extra dev
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container images
        run: docker compose -f compose.yaml -p ai-reading-assistant-ci build
      - name: Start isolated Compose stack
        env:
          APP_PORT: "18080"
          OPENAI_API_KEY: ""
        run: docker compose -f compose.yaml -p ai-reading-assistant-ci up -d --wait
      - name: Check backend health
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            http://127.0.0.1:18080/api/health
      - name: Clean up Compose stack
        if: always()
        run: docker compose -f compose.yaml -p ai-reading-assistant-ci down -v --remove-orphans
