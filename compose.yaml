services:
  backend:
    build:
      context: ./backend
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      APP_OUTPUT_LANGUAGE: ${APP_OUTPUT_LANGUAGE:-de}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/reading_assistant.db}
      UPLOAD_TEMP_DIR: ${UPLOAD_TEMP_DIR:-/tmp/reading-assistant-uploads}
      EPUB_MAX_UPLOAD_MB: ${EPUB_MAX_UPLOAD_MB:-50}
      EPUB_MAX_UNCOMPRESSED_MB: ${EPUB_MAX_UNCOMPRESSED_MB:-250}
      EPUB_MAX_ARCHIVE_ENTRIES: ${EPUB_MAX_ARCHIVE_ENTRIES:-5000}
    volumes:
      - reading-data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      EPUB_MAX_UPLOAD_MB: ${EPUB_MAX_UPLOAD_MB:-50}
      NGINX_ENVSUBST_FILTER: ^EPUB_MAX_UPLOAD_MB$
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  reading-data:
